<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f0b29" />
    </radialGradient>
    
    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Glassmorphism Reflection Overlay -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow for Geometric Elements -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Rounded Rectangle Card Backing (App Icon Frame) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Glow -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#2e2a5f" stroke-width="2" stroke-opacity="0.6" />

  <!-- Abstract Geometric Motif (MZ growth bars with dynamic audit angles) -->
  <g filter="url(#shadow)">
    <!-- Base Pillar: Legacy foundation (representing stability) -->
    <path d="M 160,360 L 200,360 L 200,280 L 160,300 Z" fill="#312e81" opacity="0.6" />

    <!-- Anchor Curve - Left Dynamic Node -->
    <path d="M 162,298 C 190,260 220,240 256,240" fill="none" stroke="#4338ca" stroke-width="6" stroke-linecap="round" opacity="0.4" />

    <!-- Trend 1: Main Emerald Ledger Flow (Dynamic ascending wave representing high performance) -->
    <path d="M 200,360 L 246,360 L 246,220 L 200,240 Z" fill="url(#emeraldGrad)" />

    <!-- Trend 2: Secondary Gold Audit Column (Dynamic growth representing balance and asset protection) -->
    <path d="M 266,360 L 312,360 L 312,160 L 266,182 Z" fill="url(#goldGrad)" />

    <!-- Trend 3: Ultimate Future Goal Node (The Peak of Strategy) -->
    <path d="M 332,360 L 378,360 L 378,110 L 332,130 Z" fill="#ffffff" opacity="0.9" />

    <!-- Connected Audit Chart line Overlay -->
    <polyline points="180,290 223,230 289,171 355,120" fill="none" stroke="#fef08a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
    
    <!-- Outer Glow Point on Peak -->
    <circle cx="355" cy="120" r="10" fill="#fef08a" />
    <circle cx="355" cy="120" r="22" fill="#fef08a" opacity="0.3" />
  </g>

  <!-- Diagonal Elegant Reflection (Sleek Glass Reflection Overlay) -->
  <path d="M 0,0 L 512,0 C 512,180 340,320 0,160 Z" fill="url(#glassGrad)" />
</svg>
